# Killarr Configuration
# Killarr can share this file with Rangarr. Both tools read the shared
# `instances:` section. Each tool reads its own top-level section
# (`global:` for Rangarr, `killarr:` for Killarr) and ignores the other's.
#
# Mount this file at /app/config/config.yaml in your container.

# --- Rangarr settings (ignored by Killarr) ---
# global:
#   interval: 3600
#   missing_batch_size: 20

# --- Killarr settings ---
killarr:
  interval: 3600              # Run every hour (seconds)
  stagger_interval_seconds: 5 # Wait between individual removals

  # batch_size: 10            # Max stalled items to remove per cycle (default)
  # batch_size: -1            # Remove all stalled items each cycle (unlimited)
  # batch_size: 0             # Disable removal entirely

  # --- Stall actions ---
  # Each stall category maps to a dict of granular flags:
  #   remove:    Delete from queue + download client.
  #   blocklist: Add to *arr blocklist (requires remove: true).
  #   search:    Trigger a fresh search after removal (requires remove: true).
  #
  # Omit a category (or set remove: false) to ignore it.
  # The 'stalled' key is the fallback for any category not explicitly configured.
  # Resolution order: instance override -> global -> stalled -> ignore
  #
  # stalled:        {remove: true, blocklist: true, search: true}  # Generic stalls (0 peers, no seeds)
  # no_upgrade:     {remove: false}                                 # "Not a Custom Format upgrade" — safe to leave
  # manual_import:  {remove: false}                                 # Requires manual intervention
  # no_files:       {remove: true}                                  # Nothing eligible for import
  # missing_items:  {remove: true}                                  # Episodes/tracks missing from release
  # tba_title:      {remove: false}                                 # Episode title not yet announced
  # dangerous_file: {remove: true, blocklist: true, search: true}  # Fake/malicious releases (.exe, .iso)

  # removal_order: api_order    # Item order within a cycle: api_order, age_ascending, age_descending

  # include_tags: ["active"]   # Only act on items with ANY of these tags
  # exclude_tags: ["protected"] # Skip items with ANY of these tags

  dry_run: false              # Set to true to log without making changes

# --- Shared instance definitions ---
instances:
  radarr:
    type: radarr
    host: "http://radarr:7878"       # Use container hostname for Docker
    api_key: "YOUR_RADARR_API_KEY"
    enabled: true
    # killarr:                       # Per-instance Killarr overrides (optional)
    #   batch_size: 5
    #   no_upgrade: {remove: true}   # Override for this instance

  sonarr:
    type: sonarr
    host: "http://sonarr:8989"
    api_key: "YOUR_SONARR_API_KEY"
    enabled: false                   # Set to true to activate

  lidarr:
    type: lidarr
    host: "http://lidarr:8686"
    api_key: "YOUR_LIDARR_API_KEY"
    enabled: false
